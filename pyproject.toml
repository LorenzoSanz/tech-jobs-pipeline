[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-tech-jobs-pipeline"
version = "0.1.0"
description = "Collects public tech job postings for Switzerland and turns them into a chronological market dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Sanz Cerveró" }]
dependencies = []

[project.scripts]
jobpipe = "jobpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
