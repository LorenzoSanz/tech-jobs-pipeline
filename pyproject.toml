[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-tech-jobs-pipeline"
version = "0.1.0"
description = "Collects public tech job postings and salary benchmarks for Switzerland, Spain and Europe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Sanz Cerveró" }]
dependencies = []

[project.scripts]
jobpipe = "jobpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# PostgreSQL loader for `jobpipe load` (the collectors need nothing).
db = ["psycopg[binary]>=3.2"]
# Lint, type checks and property tests; pinned so CI and a laptop agree.
dev = ["ruff==0.17.4", "mypy==2.4.1", "hypothesis==6.170.15"]

[tool.setuptools.package-data]
"jobpipe.warehouse" = ["schema.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "PERF", "RET", "LOG", "BLE", "RUF"]
ignore = [
    "E501",  # catalogue rows (technologies, cities, employers) read better on one line
    "RUF001", "RUF002", "RUF003",  # Spanish and German text, en dashes in place names
]

[tool.ruff.lint.isort]
known-first-party = ["jobpipe", "tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "benchmarks"]
mypy_path = "src"
