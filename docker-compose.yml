# Local warehouse and dashboards. Ports are bound to 127.0.0.1 only.
#
#   cp .env.example .env        # optional: change the passwords
#   docker compose up -d --build
#   jobpipe load                # bronze -> PostgreSQL
#   open http://localhost:3000
name: jobpipe

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: jobpipe
      POSTGRES_USER: jobpipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpipe}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpipe -d jobpipe"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    build: ./grafana            # grafana-oss:11.4.0 plus grafana/theme/jobpipe.css
    image: jobpipe-grafana:11.4.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/en/feed.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Form behind the "Add a posting" link: writes to ./data/bronze, then reloads the warehouse.
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: jobpipe-app:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JOBPIPE_DATABASE_URL: postgresql://jobpipe:${POSTGRES_PASSWORD:-jobpipe}@postgres:5432/jobpipe
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

volumes:
  pgdata:
  grafana-data:
