apiVersion: 1
datasources:
  - name: jobpipe
    uid: jobpipe-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: jobpipe
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
