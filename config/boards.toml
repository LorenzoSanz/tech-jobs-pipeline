# Public ATS job boards to snapshot on every run.
#
# Only add companies that hire in Switzerland, Spain or Europe (incl. remote).
# Get suggestions from collected HN data with:
#   python -m jobpipe discover-boards --region ch --region es --region eu
# and check each board in a browser before adding it:
#   greenhouse -> https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#   lever      -> https://api.lever.co/v0/postings/<site>?mode=json
#   ashby      -> https://api.ashbyhq.com/posting-api/job-board/<name>
#   smartrecruiters -> https://api.smartrecruiters.com/v1/companies/<id>/postings
#   workable   -> https://apply.workable.com/api/v1/widget/accounts/<account>
#   recruitee  -> https://<company>.recruitee.com/api/offers/
#   personio   -> https://<company>.jobs.personio.de/xml

