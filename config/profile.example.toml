# Your profile, for `jobpipe feed` and the "For you" dashboard.
# Copy to config/profile.toml (not committed) and edit. Rerun `jobpipe load` after a change.

# Technologies you know. Keys from src/jobpipe/tech.py, e.g. python, sql, postgresql,
# kafka, airflow, dbt, spark, docker, kubernetes, terraform, aws, gcp, grafana.
skills = ["python", "sql", "postgresql", "docker", "grafana", "linux"]

# Role families to keep (src/jobpipe/roles.py). Empty means every role.
roles = ["data", "devops", "backend"]

# ch, es, eu (rest of Europe) and other (unknown or outside Europe). Empty means everywhere.
regions = ["ch", "es", "eu"]

# Titles to skip, as a regex (case-insensitive). Single quotes keep backslashes as typed.
exclude_title = 'intern|sales|principal|director|head of|\bvp\b'
